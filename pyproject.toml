[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hepa"
version = "1.0.0"
description = "HEPA: Horizon-conditioned Event Predictive Architecture for self-supervised event forecasting in multivariate time series."
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.9"
authors = [
    { name = "Jonas Petersen", email = "jep79@cantab.ac.uk" },
    { name = "Gian-Alessandro Lombardi" },
    { name = "Riccardo Maggioni" },
    { name = "Camilla Mazzoleni" },
    { name = "Federico Martelli" },
    { name = "Philipp Petersen" },
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "scikit-learn",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/Forgis-Labs/HEPA"
Paper = "https://arxiv.org/abs/2605.11130"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["hepa*"]
exclude = ["tests*", "scripts*"]
